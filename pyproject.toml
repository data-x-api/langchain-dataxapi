[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langchain-dataxapi"
version = "0.1.0"
description = "LangChain tools for DataXAPI: public data from Douyin, Xiaohongshu (RedNote), WeChat, Weibo, Bilibili, Zhihu, Kuaishou, TikTok, YouTube, X and Reddit for agents."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10,<4.0"
authors = [{ name = "DataXAPI", email = "support@dataxapi.com" }]
keywords = ["langchain", "langgraph", "tools", "toolkit", "agents", "social media", "douyin", "xiaohongshu", "rednote", "wechat", "weibo", "bilibili", "tiktok", "youtube"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Libraries",
  "Typing :: Typed",
]
dependencies = ["langchain-core>=0.3.60,<2.0.0", "httpx>=0.27,<1.0"]

[project.urls]
Homepage = "https://dataxapi.com/?ref=langchain"
Documentation = "https://github.com/data-x-api/langchain-dataxapi#readme"
Repository = "https://github.com/data-x-api/langchain-dataxapi"
Issues = "https://github.com/data-x-api/langchain-dataxapi/issues"

[dependency-groups]
test = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-socket>=0.7",
  "langchain-tests>=1.1.9,<2",
]
lint = ["ruff>=0.8"]
typing = ["mypy>=1.13"]

[tool.hatch.build.targets.wheel]
packages = ["langchain_dataxapi"]

[tool.hatch.build.targets.sdist]
include = ["langchain_dataxapi", "tests", "scripts", "README.md", "LICENSE"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "T201"]

[tool.ruff.lint.per-file-ignores]
"langchain_dataxapi/endpoint_tools.py" = ["E501"]
"scripts/*" = ["T201"]
"examples/*" = ["T201"]

[tool.mypy]
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --durations=5"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["compile: placeholder test used to compile integration tests without running them"]
